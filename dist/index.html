<script>
(function() {
  var deprecated = [];
  var tooltip = document.getElementById('dep-tooltip');
  var ttName = tooltip.querySelector('.tt-name');
  var ttRing = tooltip.querySelector('.tt-ring');
  var ttDesc = tooltip.querySelector('.tt-desc');

  function attachDeprecatedListeners(el, entry) {
    el.addEventListener('mouseenter', function(e) {
      ttName.textContent = entry.name;
      ttRing.textContent = 'Deprecated';
      ttDesc.textContent = entry.description;
      tooltip.style.display = 'block';
    });
    el.addEventListener('mousemove', function(e) {
      var tx = e.clientX + 16;
      var ty = e.clientY + 16;
      if (tx + 300 > window.innerWidth) tx = e.clientX - 316;
      if (ty + 100 > window.innerHeight) ty = e.clientY - 100;
      tooltip.style.left = tx + 'px';
      tooltip.style.top = ty + 'px';
    });
    el.addEventListener('mouseleave', function() {
      tooltip.style.display = 'none';
    });
    el.addEventListener('click', function() {
      if (entry.url) window.open(entry.url, '_blank');
    });
  }

  document.querySelectorAll('.deprecated-item').forEach(function(el) {
    var name = el.getAttribute('data-name');
    var entry = deprecated.find(function(d) { return d.name === name; });
    if (!entry) return;
    attachDeprecatedListeners(el, entry);
  });
})();
</script>
<script>
(function() {
  var entries = [{"label":"A2A (Agent-to-Agent Protocol)","quadrant":3,"ring":2,"moved":0,"active":true,"link":"","url":"https://google.github.io/A2A/","description":"Google-led open protocol complementing MCP that enables agents built\nby different vendors to discover and communicate with each other.\nStill early but has significant interoperability potential for\nmulti-agent systems.\n","quadrantName":"Techniques","ringName":"Assess"},{"label":"Agentic Coding","quadrant":3,"ring":1,"moved":0,"active":true,"link":"","url":"https://www.anthropic.com/engineering/claude-code-best-practices","description":"Using AI agents (Claude Code, Cursor, Cline) as autonomous coding\npartners that read codebases, edit files, run commands, and iterate.\nMoving beyond autocomplete to full task execution within development\nworkflows.\n","quadrantName":"Techniques","ringName":"Trial"},{"label":"Agents","quadrant":3,"ring":1,"moved":0,"active":true,"link":"","url":"https://en.wikipedia.org/wiki/Intelligent_agent","description":"AI agents are autonomous systems that use LLMs to reason, plan, and\nexecute multi-step tasks with tool access.\n","quadrantName":"Techniques","ringName":"Trial"},{"label":"AI Code Review","quadrant":3,"ring":0,"moved":0,"active":true,"link":"","url":"","description":"Automated AI-powered code review integrated into pull request\nworkflows. Tools like CodeRabbit and Qodo provide contextual inline\ncomments, bug detection, and cross-repository impact analysis.\nComplements agentic coding by providing an automated quality gate.\n\nThere are multiple vendors, like Code Rabbit, or Qodo. Github also can use codex for automated code reviews.\n","quadrantName":"Techniques","ringName":"Adopt"},{"label":"BMAD","quadrant":3,"ring":2,"moved":0,"active":true,"link":"","url":"https://docs.bmad-method.org/tutorials/getting-started/","description":"BMAD (Breakthrough Method for Agile AI-Driven Development) is a\nframework that guides software teams through planning, architecture,\nand implementation using specialized AI agents. It organizes work\ninto defined phases—analysis, planning, solutioning, and\nimplementation—to streamline AI-assisted software delivery.\n","quadrantName":"Techniques","ringName":"Assess"},{"label":"Constrained Decoding","quadrant":3,"ring":2,"moved":0,"active":true,"link":"","url":"https://blog.vllm.ai/2025/01/14/struct-decode-intro.html","description":"Token-level enforcement of output schemas (JSON Schema, regex,\ngrammars) through FSM-guided generation and grammar-based masking.\nGuarantees 100% structural compliance versus best-effort prompting.\nNow integrated into vLLM, OpenAI, and other serving engines.\n","quadrantName":"Techniques","ringName":"Assess"},{"label":"Context Engineering","quadrant":3,"ring":1,"moved":0,"active":true,"link":"","url":"https://www.promptingguide.ai/guides/context-engineering-guide","description":"The systematic management of everything fed into a model — user\nmetadata, conversation history, data schemas, tool definitions,\nmemory, and caching strategies. The evolution beyond basic prompt\nengineering for building reliable LLM applications.\n","quadrantName":"Techniques","ringName":"Trial"},{"label":"DPO (Direct Preference Optimization)","quadrant":3,"ring":2,"moved":0,"active":true,"link":"","url":"https://arxiv.org/abs/2305.18290","description":"A simpler alternative to RLHF that sidesteps reward model training\nby deriving a closed-form solution to the preference optimization\nobjective. More stable and often matches RLHF performance with\nsignificantly less infrastructure complexity.\n","quadrantName":"Techniques","ringName":"Assess"},{"label":"Evals","quadrant":3,"ring":0,"moved":0,"active":true,"link":"","url":"https://newsletter.pragmaticengineer.com/p/evals","description":"Evals driven development is the concept of putting data at the\nforefront of LLM based systems, whithout which no development\nshould happen.\n","quadrantName":"Techniques","ringName":"Adopt"},{"label":"GRPO (Group Relative Policy Optimization)","quadrant":3,"ring":2,"moved":0,"active":true,"link":"","url":"https://arxiv.org/abs/2501.12948","description":"The RL algorithm behind DeepSeek-R1's reasoning capabilities.\nEliminates both the reward model and critic from the RLHF pipeline,\ncutting compute requirements roughly in half versus PPO. Incentivizes\nemergent reasoning behaviors like self-reflection and verification.\n","quadrantName":"Techniques","ringName":"Assess"},{"label":"Knowledge Distillation","quadrant":3,"ring":2,"moved":0,"active":true,"link":"","url":"https://www.ibm.com/think/topics/knowledge-distillation","description":"Training a smaller student model to replicate a larger teacher\nmodel's capabilities, enabling faster, cheaper production\ndeployments. Increasingly practical with LoRA/QLoRA for\nparameter-efficient transfer.\n","quadrantName":"Techniques","ringName":"Assess"},{"label":"LLM-as-Judge","quadrant":3,"ring":0,"moved":0,"active":true,"link":"","url":"","description":"Using large language models to evaluate and score the outputs of\nother LLMs, enabling scalable and automated quality assessment of\nAI-generated content.\n","quadrantName":"Techniques","ringName":"Adopt"},{"label":"LLM Guardrails","quadrant":3,"ring":1,"moved":0,"active":true,"link":"","url":"https://github.com/NVIDIA/NeMo-Guardrails","description":"Runtime input/output filtering for LLM applications including prompt\ninjection detection, PII redaction, and topic control. Frameworks\nlike NeMo Guardrails and Guardrails AI are maturing, making this\nessential for production AI systems.\n","quadrantName":"Techniques","ringName":"Trial"},{"label":"LoRA / QLoRA Fine-Tuning","quadrant":3,"ring":1,"moved":0,"active":true,"link":"","url":"https://huggingface.co/docs/peft/main/en/conceptual_guides/lora","description":"LoRA reduces trainable parameters by ~99%, enabling fine-tuning of\nlarge models on a single GPU. QLoRA extends this with 4-bit\nquantization. The dominant approach for teams needing domain\nadaptation beyond what RAG and prompting alone can achieve.\n","quadrantName":"Techniques","ringName":"Trial"},{"label":"MCP (Model Context Protocol)","quadrant":3,"ring":1,"moved":0,"active":true,"link":"","url":"https://modelcontextprotocol.io/","description":"Open protocol originally by Anthropic (now under Linux Foundation)\nthat standardizes how LLMs connect to external tools and data\nsources. Adopted by OpenAI, Google, and major toolmakers, it is\nbecoming the de facto integration standard for LLM applications.\n","quadrantName":"Techniques","ringName":"Trial"},{"label":"Prompt Caching","quadrant":3,"ring":0,"moved":0,"active":true,"link":"","url":"https://www.anthropic.com/news/prompt-caching","description":"Reusing KV tensors across API requests when prompts share common\nprefixes, natively supported by Anthropic, OpenAI, and Google.\nDelivers 50-90% cost reduction and major latency improvements with\nminimal code changes.\n","quadrantName":"Techniques","ringName":"Adopt"},{"label":"RAG","quadrant":3,"ring":1,"moved":0,"active":true,"link":"","url":"https://en.wikipedia.org/wiki/Retrieval-augmented_generation","description":"Retrieval-Augmented Generation combines LLM capabilities with external\nknowledge retrieval to produce more accurate, grounded responses.\n","quadrantName":"Techniques","ringName":"Trial"},{"label":"Spec-driven AI dev","quadrant":3,"ring":2,"moved":0,"active":true,"link":"","url":"https://www.thoughtworks.com/radar","description":"Using structured specifications to guide AI-assisted software\ndevelopment, ensuring consistent and predictable outputs.\n","quadrantName":"Techniques","ringName":"Assess"},{"label":"Structured Output","quadrant":3,"ring":0,"moved":0,"active":true,"link":"","url":"","description":"Constraining LLM responses to follow a specific schema or format,\nensuring reliable and parseable output for programmatic consumption.\n","quadrantName":"Techniques","ringName":"Adopt"},{"label":"Synthetic Data Generation","quadrant":3,"ring":1,"moved":0,"active":true,"link":"","url":"https://www.confident-ai.com/blog/the-definitive-guide-to-synthetic-data-generation-using-llms","description":"Using LLMs to generate training, evaluation, and fine-tuning\ndatasets through distillation from larger models or self-improvement\nloops. Critical for building domain-specific models or comprehensive\neval suites where real data is scarce or expensive to label.\n","quadrantName":"Techniques","ringName":"Trial"},{"label":"Test-Time Compute","quadrant":3,"ring":2,"moved":0,"active":true,"link":"","url":"https://huggingface.co/learn/llm-course/en/chapter12/3","description":"Allocating additional computation at inference time to improve\nresponse quality through extended chain-of-thought reasoning.\nPopularized by OpenAI's o-series and DeepSeek-R1, representing a\nfundamental shift in the cost/quality tradeoff.\n","quadrantName":"Techniques","ringName":"Assess"},{"label":"Tool Calling","quadrant":3,"ring":1,"moved":0,"active":true,"link":"","url":"","description":"Enabling LLMs to invoke external tools and APIs, allowing them to\nperform actions and retrieve real-time information beyond their\ntraining data.\nTool calling is a key method to increase LLM's awareness. Be mindful of how many tools\nfit in your LLM's context window. You'll possibly be fine up to ~20 tools but this \napproach by itself will very likely break down once you reach 40-50 tools.\nThere are [workarounds](https://medium.com/zar-engineering/code-mode-mcp-ac17c2a1038b) or you need specialised agents.\n","quadrantName":"Techniques","ringName":"Trial"},{"label":"Arize Phoenix","quadrant":0,"ring":2,"moved":0,"active":true,"link":"","url":"https://phoenix.arize.com/","description":"Open-source AI observability platform that accepts traces via\nstandard OTLP protocol. Provides tracing, evaluation, datasets,\nexperiments, and prompt management. Self-hosted with full data\ncontrol for strict data-residency requirements.\n","quadrantName":"Tools","ringName":"Assess"},{"label":"Braintrust","quadrant":0,"ring":1,"moved":0,"active":true,"link":"","url":"https://www.braintrust.dev/","description":"An enterprise AI evaluation platform for testing, scoring, and\nimproving LLM-based applications with systematic experimentation.\n","quadrantName":"Tools","ringName":"Trial"},{"label":"Chroma","quadrant":0,"ring":2,"moved":0,"active":true,"link":"","url":"https://www.trychroma.com/","description":"Developer-friendly, lightweight, open-source vector database\nexcellent for prototyping and small/medium RAG applications. Easy to\nembed directly in Python applications. For teams already on\nPostgreSQL, pgvector offers similar ease of use with the added\nbenefit of keeping data in a single database.\n","quadrantName":"Tools","ringName":"Assess"},{"label":"Claude Code","quadrant":0,"ring":0,"moved":0,"active":true,"link":"","url":"https://docs.anthropic.com/en/docs/claude-code","description":"Anthropic's terminal-based agentic coding tool with a 200K context window, \nmulti-agent sub-tasks, and deep codebase understanding. \nLeading the shift from code suggestions to autonomous coding.\nThis is the leading coding tool and we recommend its adoption for software \nengineering and more.\n","quadrantName":"Tools","ringName":"Adopt"},{"label":"CodeRabbit","quadrant":0,"ring":2,"moved":0,"active":true,"link":"","url":"https://coderabbit.ai/","description":"AI-assisted pull request reviewer that runs inside GitHub/GitLab,\nproviding automated PR summaries, inline code comments, and suggested\nfixes. Complements agentic coding by providing an automated quality\ngate before merging.\n","quadrantName":"Tools","ringName":"Assess"},{"label":"Cursor","quadrant":0,"ring":1,"moved":0,"active":true,"link":"","url":"https://www.cursor.com/","description":"VS Code fork rebuilt around AI with agent mode, multi-file editing,\nand enterprise readiness (SOC 2, SSO). Widely adopted for AI-assisted\ndevelopment across organizations of all sizes.\n","quadrantName":"Tools","ringName":"Trial"},{"label":"Entire.io","quadrant":0,"ring":3,"moved":0,"active":true,"link":"","url":"https://entire.io/","description":"While helpful, Entire.io generates a lot of data and it's not clear\nhow useful that is, as long as one follows software engineering best\npractices, like committing frequently.\n","quadrantName":"Tools","ringName":"Hold"},{"label":"Groq","quadrant":0,"ring":2,"moved":0,"active":true,"link":"","url":"https://groq.com/","description":"Purpose-built Language Processing Unit (LPU) hardware delivering\nultra-fast inference with up to 18x faster processing than\ntraditional GPUs. Extremely low time-to-first-token for\nlatency-critical applications with an OpenAI-compatible API.\n","quadrantName":"Tools","ringName":"Assess"},{"label":"Helicone","quadrant":0,"ring":2,"moved":0,"active":true,"link":"","url":"https://www.helicone.ai/","description":"Open-source AI gateway and observability platform built in Rust.\nRoutes, caches, load-balances, and logs requests across 100+ LLM\nproviders with minimal latency overhead. Semantic caching can reduce\ncosts by up to 95%.\n","quadrantName":"Tools","ringName":"Assess"},{"label":"Hyperterse","quadrant":0,"ring":2,"moved":0,"active":true,"link":"","url":"https://hyperterse.com/","description":"Open-source framework for building MCP tool servers from declaration\nfiles. Collapses all tools behind search and execute so AI agents\ndynamically discover what they need. Includes authentication,\ncaching, and OpenTelemetry observability out of the box.\n","quadrantName":"Tools","ringName":"Assess"},{"label":"Langfuse","quadrant":0,"ring":1,"moved":0,"active":true,"link":"","url":"https://langfuse.com/","description":"An open-source LLM engineering platform for observability, analytics,\nprompt management, and evaluation of AI applications.\n","quadrantName":"Tools","ringName":"Trial"},{"label":"LangSmith","quadrant":0,"ring":1,"moved":0,"active":true,"link":"","url":"https://www.langchain.com/langsmith","description":"A platform for debugging, testing, evaluating, and monitoring LLM\napplications built on any framework.\n","quadrantName":"Tools","ringName":"Trial"},{"label":"LiteLLM","quadrant":0,"ring":1,"moved":0,"active":true,"link":"","url":"https://docs.litellm.ai/","description":"A unified API interface for calling 100+ LLM providers, \nsimplifying multi-model integration and cost management. \n\nLitellm is an acceptable way for your solution to be provider and model agnostic. \nHowever, its code is full of technical debt and the pathways for each provider or model\nhave flaws and bugs. Consider whether you really need to be provider agnostic or if \nyou only need to support a couple of key providers through custom code.\"\n","quadrantName":"Tools","ringName":"Trial"},{"label":"Ollama","quadrant":0,"ring":1,"moved":0,"active":true,"link":"","url":"https://ollama.com/","description":"Docker-style Go binary that makes running local LLMs trivially easy.\nExcellent for developer experimentation, local testing, and rapid\nprototyping with an OpenAI-compatible API.\n","quadrantName":"Tools","ringName":"Trial"},{"label":"OpenClaw","quadrant":0,"ring":3,"moved":0,"active":true,"link":"","url":"https://openclaw.ai/","description":"OpenClaw is an open-source AI agent that runs locally and can execute\nshell commands, manage files, and automate browser tasks. However, it\nlacks a strong security model out of the box—agents can escalate\nactions beyond user intent (e.g. deleting data without confirmation),\nand granting broad system permissions to an LLM-driven tool creates a\nsignificant attack surface for data leaks and uncontrolled\nautomation.\n","quadrantName":"Tools","ringName":"Hold"},{"label":"Pinecone","quadrant":0,"ring":1,"moved":0,"active":true,"link":"","url":"https://www.pinecone.io/","description":"Managed serverless vector database with exceptional query speed and\nmulti-region performance. Minimal operational overhead makes it the\nleading choice for production-grade vector search without managing\ninfrastructure. Teams already running PostgreSQL should consider\npgvector + pgvectorscale as a strong alternative that benchmarks\ncompetitively at significantly lower cost.\n","quadrantName":"Tools","ringName":"Trial"},{"label":"Portkey","quadrant":0,"ring":2,"moved":0,"active":true,"link":"","url":"https://portkey.ai/","description":"AI gateway for routing requests across 1600+ LLMs with built-in\nobservability, guardrails, fallbacks, and cost governance. Named a\nGartner Cool Vendor 2025 in LLM Observability.\n","quadrantName":"Tools","ringName":"Assess"},{"label":"Qdrant","quadrant":0,"ring":1,"moved":0,"active":true,"link":"","url":"https://qdrant.tech/","description":"Open-source vector database written in Rust, emphasizing high\nperformance, compact memory footprint, and powerful metadata\nfiltering. Offers both self-hosted and managed cloud options with\nACID-compliant transactions. PostgreSQL with pgvector is a strong\nalternative for teams that prefer consolidating vector search into\ntheir existing database rather than running separate infrastructure.\n","quadrantName":"Tools","ringName":"Trial"},{"label":"Qodo","quadrant":0,"ring":2,"moved":0,"active":true,"link":"","url":"https://www.qodo.ai/","description":"AI code assistant with a multi-repo context engine that understands\ndependency graphs and flags cross-service breaking changes. Offers\n15+ agentic workflows for reviews, test generation, and\ndocumentation.\n","quadrantName":"Tools","ringName":"Assess"},{"label":"RAGAS","quadrant":0,"ring":1,"moved":0,"active":true,"link":"","url":"https://docs.ragas.io/","description":"RAGAS is a framework for evaluating Retrieval-Augmented Generation\npipelines, providing metrics for faithfulness, relevance, and\ncorrectness.\n","quadrantName":"Tools","ringName":"Trial"},{"label":"vLLM","quadrant":0,"ring":1,"moved":0,"active":true,"link":"","url":"https://github.com/vllm-project/vllm","description":"High-throughput, memory-efficient open-source inference engine\ndelivering 35x+ request throughput over alternatives. Supports\nomni-modality serving. The go-to engine for teams self-hosting LLMs\nin production at scale.\n","quadrantName":"Tools","ringName":"Trial"},{"label":"Claude Agent SDK","quadrant":2,"ring":1,"moved":0,"active":true,"link":"","url":"https://docs.anthropic.com/en/docs/agents-and-tools/claude-agent-sdk","description":"Anthropic's SDK for building custom AI agents powered by Claude, with\nbuilt-in tool use, memory, and orchestration capabilities.\n","quadrantName":"Languages & Frameworks","ringName":"Trial"},{"label":"CrewAI","quadrant":2,"ring":2,"moved":0,"active":true,"link":"","url":"https://www.crewai.com/","description":"Multi-agent orchestration framework where you define agents with roles \nand goals that collaborate on tasks. Provides an intuitive abstraction \nfor teams thinking in terms of roles and responsibilities.\n","quadrantName":"Languages & Frameworks","ringName":"Assess"},{"label":"DSPy","quadrant":2,"ring":1,"moved":0,"active":true,"link":"","url":"https://dspy-docs.vercel.app/","description":"A framework for programming with foundation models through\ndeclarative language model calls, automatic prompt optimization, and\nfine-tuning.\n","quadrantName":"Languages & Frameworks","ringName":"Trial"},{"label":"Google ADK (Agent Development Kit)","quadrant":2,"ring":2,"moved":0,"active":true,"link":"","url":"https://google.github.io/adk-docs/","description":"Open-source agent framework from Google, model-agnostic and\ndeployment-agnostic despite being optimized for Gemini/GCP. Features\nbuilt-in bidirectional audio/video streaming for human-like agent\nconversations.\n","quadrantName":"Languages & Frameworks","ringName":"Assess"},{"label":"Haystack","quadrant":2,"ring":2,"moved":0,"active":true,"link":"","url":"https://haystack.deepset.ai/","description":"Pipeline-first framework from deepset focused on production-grade\nsearch and RAG systems. Excels at complex document processing\nworkflows with strong enterprise search backend support\n(Elasticsearch, OpenSearch).\n","quadrantName":"Languages & Frameworks","ringName":"Assess"},{"label":"Instructor","quadrant":2,"ring":1,"moved":0,"active":true,"link":"","url":"https://python.useinstructor.com/","description":"The most popular library for extracting structured, validated data\nfrom LLMs. Built on Pydantic with automatic retries, streaming, and\ntype-safe extraction. Supports 15+ providers across Python,\nTypeScript, Go, Ruby, Elixir, and Rust.\n","quadrantName":"Languages & Frameworks","ringName":"Trial"},{"label":"LangChain","quadrant":2,"ring":3,"moved":0,"active":true,"link":"","url":"https://www.langchain.com/","description":"A popular framework for developing applications powered by language\nmodels, providing chains, agents, and retrieval components.\nAlthough it's level of abstraction is good, it has frequently shown to \nmake the code  for even smaller projects too complicated to maintain \ncompared to the value it adds.\n","quadrantName":"Languages & Frameworks","ringName":"Hold"},{"label":"LangGraph","quadrant":2,"ring":2,"moved":0,"active":true,"link":"","url":"https://www.langchain.com/langgraph","description":"Graph-based agent orchestration from LangChain that represents agent\nworkflows as state machines with explicit control flow. Strong fit\nfor enterprise use cases requiring deterministic behavior.\n","quadrantName":"Languages & Frameworks","ringName":"Assess"},{"label":"LlamaIndex","quadrant":2,"ring":1,"moved":0,"active":true,"link":"","url":"https://www.llamaindex.ai/","description":"The leading RAG-first framework with the most extensive data\nconnector ecosystem. Has evolved from a document processing tool to a\nfull agent framework while maintaining its core strength in data\nintegration and retrieval.\n","quadrantName":"Languages & Frameworks","ringName":"Trial"},{"label":"Mastra","quadrant":2,"ring":2,"moved":0,"active":true,"link":"","url":"https://mastra.ai/","description":"TypeScript framework providing building blocks for agents, tools, RAG\npipelines, workflows, memory, and orchestration. Sits above Vercel AI\nSDK in abstraction to accelerate backend agent development.\n","quadrantName":"Languages & Frameworks","ringName":"Assess"},{"label":"Microsoft Agent Framework","quadrant":2,"ring":2,"moved":0,"active":true,"link":"","url":"https://github.com/microsoft/agents","description":"Microsoft's framework for building, orchestrating, and managing AI\nagents with enterprise-grade tooling and Azure integration.\n","quadrantName":"Languages & Frameworks","ringName":"Assess"},{"label":"OpenAI Agents SDK","quadrant":2,"ring":2,"moved":0,"active":true,"link":"","url":"https://openai.github.io/openai-agents-python/","description":"Production-ready agent framework with minimal abstractions (Agents,\nHandoffs, Guardrails) and built-in tracing. Provider-agnostic\ndespite the name, it is the successor to Swarm.\n","quadrantName":"Languages & Frameworks","ringName":"Assess"},{"label":"Outlines","quadrant":2,"ring":2,"moved":0,"active":true,"link":"","url":"https://github.com/dottxt-ai/outlines","description":"Pioneered the FSM approach to constrained decoding, compiling JSON\nSchemas and regex patterns into finite-state machines with\nprecomputed vocabulary indexes. Useful for teams running self-hosted\nmodels who need guaranteed output compliance.\n","quadrantName":"Languages & Frameworks","ringName":"Assess"},{"label":"PydanticAI","quadrant":2,"ring":2,"moved":0,"active":true,"link":"","url":"https://ai.pydantic.dev/","description":"Type-safe agent framework with structured I/O and MCP support. A\ngood fit for teams that value parameter correctness and Python typing\nin their AI applications.\n","quadrantName":"Languages & Frameworks","ringName":"Assess"},{"label":"Semantic Kernel","quadrant":2,"ring":2,"moved":0,"active":true,"link":"","url":"https://learn.microsoft.com/en-us/semantic-kernel/overview/","description":"Microsoft's lightweight SDK for integrating AI into existing\napplications, available in .NET, Python, and Java. Being merged with\nAutoGen into the unified Microsoft Agent Framework. Strong choice for\nteams with existing Microsoft technology investments.\n","quadrantName":"Languages & Frameworks","ringName":"Assess"},{"label":"Spring AI","quadrant":2,"ring":2,"moved":0,"active":true,"link":"","url":"https://spring.io/projects/spring-ai","description":"Spring's official AI framework, GA since May 2025. Brings Spring's\nabstraction philosophy to LLM integration — write code once, switch\nproviders via configuration. Supports all major AI providers, vector\ndatabases, Tool Calling, RAG, MCP, and structured output.\n","quadrantName":"Languages & Frameworks","ringName":"Assess"},{"label":"Vercel AI SDK","quadrant":2,"ring":1,"moved":0,"active":true,"link":"","url":"https://ai-sdk.dev/","description":"Streaming-first, provider-agnostic TypeScript SDK for building\nLLM-powered web applications. Features first-class agent\nabstractions, tool approval workflows, full MCP support, and deep\nReact/Next.js integration.\n","quadrantName":"Languages & Frameworks","ringName":"Trial"},{"label":"Apache Airflow","quadrant":1,"ring":2,"moved":0,"active":true,"link":"","url":"https://airflow.apache.org/","description":"A workflow orchestration platform for data pipelines. Deprecated in\nfavor of more modern alternatives.\n","quadrantName":"Platforms","ringName":"Assess"},{"label":"Databricks","quadrant":1,"ring":2,"moved":0,"active":true,"link":"","url":"https://www.databricks.com/","description":"Unified data + AI platform with deep MLflow integration, Unity\nCatalog for AI asset governance, and Mosaic AI for model serving.\nStrong choice for organizations already invested in the Databricks\nlakehouse.\n","quadrantName":"Platforms","ringName":"Assess"},{"label":"Graph databases","quadrant":1,"ring":1,"moved":0,"active":true,"link":"","url":"https://en.wikipedia.org/wiki/Graph_database","description":"Database systems optimized for storing and querying graph-structured\ndata, increasingly used for knowledge graphs in AI applications.\nPostgreSQL with the Apache AGE extension supports openCypher queries\nand hybrid SQL + graph operations, making it a viable alternative\nfor teams that don't need the full graph algorithm ecosystem of\ndedicated solutions like Neo4j.\n","quadrantName":"Platforms","ringName":"Trial"},{"label":"Hugging Face","quadrant":1,"ring":0,"moved":0,"active":true,"link":"","url":"https://huggingface.co/","description":"The cornerstone of the open-source AI ecosystem, hosting 2M+ models,\n500K+ datasets, and 1M+ Spaces. Provides production tools (TGI, TEI,\nInference Endpoints) alongside the Transformers library. The GitHub\nof ML.\n","quadrantName":"Platforms","ringName":"Adopt"},{"label":"MLflow","quadrant":1,"ring":1,"moved":0,"active":true,"link":"","url":"https://mlflow.org/","description":"The most widely adopted open-source MLOps platform. MLflow 3.0 adds\nproduction-scale GenAI tracing, LLM evaluation, feedback collection,\nand prompt/application version tracking. Usable standalone or deeply\nintegrated with Databricks.\n","quadrantName":"Platforms","ringName":"Trial"},{"label":"Modal","quadrant":1,"ring":2,"moved":0,"active":true,"link":"","url":"https://modal.com/","description":"Serverless cloud platform for AI/GPU workloads with a Python-native\nSDK. Sub-second cold starts, instant autoscaling, and a developer\nexperience that feels local. Eliminates infrastructure management for\ninference, training, and batch processing.\n","quadrantName":"Platforms","ringName":"Assess"},{"label":"Neo4j","quadrant":1,"ring":2,"moved":0,"active":true,"link":"","url":"https://neo4j.com/","description":"The leading graph database, widely adopted for knowledge graphs and\nGraphRAG implementations. Cypher's readable query language and a\nrich algorithm library (PageRank, community detection, shortest\npath) make it the go-to for complex graph analytics. Recent releases\nadd native vector search with metadata filtering and AI-native\nCypher procedures, enabling hybrid vector + graph traversal in a\nsingle query. Best suited for teams with dedicated graph workloads\nthat justify separate infrastructure — teams already on PostgreSQL\nshould evaluate Apache AGE as a lighter-weight alternative.\n","quadrantName":"Platforms","ringName":"Assess"},{"label":"Opik","quadrant":1,"ring":2,"moved":0,"active":true,"link":"","url":"https://www.comet.com/site/products/opik/","description":"Open-source LLM evaluation and observability platform covering the\nfull development lifecycle from experimentation to production\nmonitoring. An alternative to commercial observability tools.\n","quadrantName":"Platforms","ringName":"Assess"},{"label":"PostgreSQL (pgvector + AGE)","quadrant":1,"ring":1,"moved":0,"active":true,"link":"","url":"https://github.com/pgvector/pgvector","description":"PostgreSQL has become a compelling multi-model database for AI\nworkloads. **pgvector** adds native vector similarity search with\nHNSW and IVFFlat indexes, supporting up to 16,000 dimensions with\nL2, cosine, and inner product distance functions. The companion\n**pgvectorscale** extension (by Timescale) adds DiskANN-based\nindexing that benchmarks at 28x lower p95 latency than Pinecone at\n75% less cost on 50M vectors.\n\nFor graph workloads, **Apache AGE** brings openCypher query support,\nenabling hybrid SQL + Cypher queries with full ACID guarantees.\n\nThe key advantage is operational simplicity: one database for\nrelational, vector, and graph data — no sync pipelines, no\nadditional infrastructure, and access to PostgreSQL's mature\necosystem of replication, monitoring, and managed cloud services\n(RDS, Cloud SQL, Azure). A strong alternative to dedicated vector\nand graph databases for teams already running PostgreSQL.\n","quadrantName":"Platforms","ringName":"Trial"},{"label":"Replicate","quadrant":1,"ring":2,"moved":0,"active":true,"link":"","url":"https://replicate.com/","description":"Serverless GPU platform that simplifies model deployment via\nDockerized environments. The fastest way to deploy and test community\nmodels — great for prototyping, demos, and running niche text, image,\nvideo, and audio models.\n","quadrantName":"Platforms","ringName":"Assess"},{"label":"Together AI","quadrant":1,"ring":2,"moved":0,"active":true,"link":"","url":"https://www.together.ai/","description":"Fast serverless API for 200+ open-source models (DeepSeek, Llama,\nQwen, Mistral) with OpenAI-compatible endpoints. Inference stack is\n4x faster than standard vLLM. Also offers fine-tuning and dedicated\nendpoints.\n","quadrantName":"Platforms","ringName":"Assess"},{"label":"Weights & Biases","quadrant":1,"ring":1,"moved":0,"active":true,"link":"","url":"https://wandb.ai/","description":"AI developer platform for experiment tracking, model management, and\nGenAI observability through W&B Weave. Weave provides tracing,\nevaluation, and debugging specifically for LLM-powered applications.\nThe standard for ML experiment tracking.\n","quadrantName":"Platforms","ringName":"Trial"}];
  var ringColors = { Adopt: '#5ba300', Trial: '#009eb0', Assess: '#c7ba00', Hold: '#e09b96' };
  var lookup = {};
  entries.forEach(function(e) { lookup[e.label] = e; });

  function renderMd(text) {
    var s = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    s = s.replace(/\n\n+/g, '<br>').replace(/\n/g, ' ');
    return s;
  }

  var overlay = document.getElementById('modal-overlay');
  var modalTitle = document.getElementById('modal-title');
  var modalMeta = document.getElementById('modal-meta');
  var modalDesc = document.getElementById('modal-desc');
  var modalLink = document.getElementById('modal-link');
  var modalClose = document.getElementById('modal-close');

  function openModal(entry) {
    modalTitle.textContent = entry.label;
    var rc = ringColors[entry.ringName] || '#666';
    modalMeta.innerHTML =
      '<span class="badge-quadrant">' + entry.quadrantName + '</span>' +
      '<span class="badge-ring" style="background:' + rc + '">' + entry.ringName + '</span>';
    modalDesc.innerHTML = entry.description ? renderMd(entry.description) : '<em>No description available.</em>';
    var url = entry.url || entry.link || '';
    if (url) {
      modalLink.href = url;
      modalLink.textContent = url;
    } else {
      modalLink.href = '';
      modalLink.textContent = '';
    }
    overlay.classList.add('visible');
  }

  function closeModal() { overlay.classList.remove('visible'); }

  modalClose.addEventListener('click', closeModal);
  overlay.addEventListener('click', function(e) { if (e.target === overlay) closeModal(); });
  document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });

  // Intercept blip clicks (d3 binds entry data to each <g class="blip">)
  document.querySelectorAll('.blip').forEach(function(g) {
    var d = g.__data__;
    if (!d || !d.label) return;
    var entry = lookup[d.label];
    if (!entry) return;
    g.style.cursor = 'pointer';
    g.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      openModal(entry);
    });
  });

  // Intercept legend item clicks (text elements with id="legendItemN")
  document.querySelectorAll('[id^="legendItem"]').forEach(function(text) {
    var d = text.__data__;
    if (!d || !d.label) return;
    var entry = lookup[d.label];
    if (!entry) return;
    var anchor = text.parentNode;
    if (anchor && anchor.tagName.toLowerCase() === 'a') {
      anchor.removeAttribute('href');
      anchor.style.cursor = 'pointer';
    }
    (anchor || text).addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      openModal(entry);
    });
  });

  // Also handle deprecated item clicks to show modal
  var depEntries = [];
  document.querySelectorAll('.deprecated-item').forEach(function(el) {
    var name = el.getAttribute('data-name');
    var dep = depEntries.find(function(d) { return d.name === name; });
    if (!dep) return;
    el.addEventListener('click', function(e) {
      e.stopPropagation();
      openModal({
        label: dep.name,
        description: dep.description,
        link: dep.url || '',
        quadrantName: 'Deprecated',
        ringName: 'Hold'
      });
    });
  });
})();
</script>
